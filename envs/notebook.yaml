name: npf-notebook
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - jupyterlab>=4.0
  - pandas>=2.0
  - numpy>=1.26
  - matplotlib>=3.8
  - seaborn>=0.13
  - scikit-learn>=1.4    # re-fit GMM, silhouette scores
  - plotly>=5.20         # interactive scatter plots
  - ipywidgets>=8.0      # interactive widgets in JupyterLab
  - gemmi>=0.6           # CIF/mmCIF parsing for template sequence extraction
  - biopython>=1.83      # pairwise sequence alignment (Bio.Align)
  - scipy>=1.12          # cdist, stats (Spearman correlation)
  - kneed>=0.8           # Kneedle elbow/knee detection for DBSCAN eps selection
  - umap-learn>=0.5      # UMAP sequence-landscape projection (Jaccard metric on one-hot MSA)
  - pip:
      - polyleven>=0.8   # fast Levenshtein distance for MSA cluster identity (AF-Cluster style)
